[project]
name = "multiagent"
version = "2.0.0"
description = "多 Agent 协作完成任意文件型工作台（Multi-Agent File Workbench）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "multi_xuanwo" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
multiagent = "multiagent.cli:main"
magpie = "multiagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multiagent*"]

[tool.setuptools.package-data]
multiagent = ["web/*", "presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
